name: hoppity_app
description: Hoppity - Discover Real India

publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # Fonts
  google_fonts: ^6.1.0

  # Images
  cached_network_image: ^3.3.1

  # Video (for TikTok-style tour video feed)
  video_player: ^2.8.3
  visibility_detector: ^0.4.0+2

  # ML personalisation
  geolocator: ^11.0.0
  shared_preferences: ^2.2.3

  # Media — avatar upload (works on iOS, Android, Web)
  image_picker: ^1.1.2

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Icon and splash generation — run once during setup:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Web renderer: canvaskit for best fidelity on desktop,
  # html renderer falls back automatically on mobile browsers
  # Set via: flutter build web --web-renderer canvaskit

# ── App Icon generation ───────────────────────────────────────────────
# 1. Drop your 1024x1024 icon at assets/images/app_icon.png
# 2. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/hoppity_logo.jpg"
  adaptive_icon_background: "#EEEEF8"
  adaptive_icon_foreground: "assets/images/hoppity_logo.jpg"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/images/hoppity_logo.jpg"
    background_color: "#ffffff"
    theme_color: "#7C3AED"

# ── Splash screen generation ──────────────────────────────────────────
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#ffffff"
  image: assets/images/hoppity_logo.jpg
  image_dark: assets/images/hoppity_logo.jpg
  image_padding_percentage: 20
  android_12:
    image: assets/images/hoppity_logo.jpg
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#ffffff"
    image_padding_percentage: 20
  fullscreen: false
